services:
  autopilot:
    build: .
    environment:
      AUTOPILOT_PASSWORD: ${AUTOPILOT_PASSWORD:?Set an owner password}
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
      WHISPER_MODEL: base.en
    mem_limit: 3g
    memswap_limit: 3g
    cpus: 2
    volumes:
      - autopilot-data:/data
    restart: unless-stopped
  https:
    image: caddy:2
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set your public hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - autopilot
    restart: unless-stopped
volumes:
  autopilot-data:
  caddy-data:
  caddy-config:
