[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clips-kitty-autopilot"
version = "0.1.3"
description = "An independent Twitch community clip automation app built on the Clips Kitty starter foundation"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "requests>=2.32,<3", "cryptography>=43", "yt-dlp>=2026.8.19", "tzdata>=2025.1"]

[project.optional-dependencies]
media = ["faster-whisper>=1.2,<2", "opencv-python-headless>=4.10,<6", "ultralytics-opencv-headless>=8.4,<9", "python-speech-features>=0.6,<1", "scipy>=1.10,<2"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.9", "numpy>=1.26,<3", "opencv-python-headless>=4.10,<6"]

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.setuptools.package-data]
autopilot = ["static/*", "engine/*.json", "vendor/talknet/*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["data", ".venv", "autopilot/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"autopilot/engine/*" = ["I", "UP", "B", "E"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["media: real FFmpeg render/decode checks"]
