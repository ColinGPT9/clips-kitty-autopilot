# Deploy only after reviewing the selected paid plan and disk in your Render account.
services:
  - type: web
    name: clips-kitty-autopilot
    runtime: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /health
    autoDeployTrigger: "off"
    disk:
      name: autopilot-data
      mountPath: /data
      sizeGB: 10
    envVars:
      - key: AUTOPILOT_PASSWORD
        generateValue: true
      - key: DATA_DIR
        value: /data
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "8000"
      - key: WHISPER_MODEL
        value: base.en
